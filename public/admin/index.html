<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Kamadhenu Goushala</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100" style="background: radial-gradient(circle at top, #245A40 0%, #0E2419 100%);">

  <div class="container" style="max-width: 440px;">
    <div class="p-4 p-md-5 bg-white rounded-4 shadow-lg">
      
      <!-- Brand Logo -->
      <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-2" style="width: 55px; height: 55px; font-size: 1.8rem;">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h3 class="fw-bold text-forest mb-0">Admin Portal</h3>
        <small class="text-muted">Kamadhenu Goushala Management</small>
      </div>

      <!-- Login Form -->
      <form id="adminLoginForm">
        <div class="mb-3">
          <label class="form-label fw-semibold">Admin Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
            <input type="email" id="loginEmail" class="form-control py-2" placeholder="admin@kamadhenugoushala.org" value="admin@kamadhenugoushala.org" required autofocus>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
            <input type="password" id="loginPassword" class="form-control py-2" placeholder="••••••••" value="Admin@123" required>
          </div>
        </div>

        <button type="submit" id="btnLoginSubmit" class="btn btn-gold w-100 py-3 fs-6">
          <i class="bi bi-box-arrow-in-right me-2"></i> Log In to Dashboard
        </button>

        <div class="text-center mt-4">
          <a href="/index.html" class="small text-muted text-decoration-none">
            <i class="bi bi-arrow-left me-1"></i> Back to Public Website
          </a>
        </div>
      </form>

    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/admin/js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('adminLoginForm');
      const submitBtn = document.getElementById('btnLoginSubmit');

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (!email || !password) {
          showToast('Please enter your email and password.', 'error');
          return;
        }

        try {
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Authenticating...';

          const res = await API.post('/auth/login', { email, password });
          if (res && res.success) {
            showToast('Login successful! Redirecting...', 'success');
            setTimeout(() => {
              window.location.href = '/admin/dashboard.html';
            }, 800);
          } else {
            showToast(res.message || 'Invalid credentials.', 'error');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i> Log In to Dashboard';
          }
        } catch (err) {
          showToast(err.message || 'Login failed. Please verify email and password.', 'error');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i> Log In to Dashboard';
        }
      });
    });
  </script>
</body>
</html>
